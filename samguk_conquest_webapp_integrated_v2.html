function addPoint(id){const t=state.territories.find(x=>x.playerId===id);if(t&&!t.isKing)t.strategy++;save()}function act(type){const t=myTile();if(!t||t.isKing)return;let c=0;if(type==='troop')c=1;else if(type==='agri')c=2;else c=2+t.militaryLevel;if(t.strategy<c){alert('전략 포인트가 부족합니다.');return}t.strategy-=c;if(type==='troop')t.troops++;if(type==='agri')t.production++;if(type==='military')t.militaryLevel=Math.min(4,t.militaryLevel+1);save()}
function nextRound(){state.round++;state.territories.forEach(t=>{t.fought=0;if(!t.isKing){t.food+=t.production-t.troops;if(t.food<0){const loss=Math.min(t.troops,Math.ceil(-t.food/1.5));t.troops-=loss;t.food=0;state.log.unshift('식량 부족으로 병력 '+loss+' 감소')}}});save()}
function battle(a,d){if(state.round===1){alert('1라운드는 준비 라운드입니다.');return}const A=state.territories[a],D=state.territories[d];if(A.isKing||D.isKing){alert('왕 타일은 일반 전투에 참여하지 않습니다.');return}if(A.country===D.country||!(MAP.adj[a]||[]).includes(d)){alert('서로 맞닿은 적국 타일만 전투할 수 있습니다.');return}if(A.fought===state.round||D.fought===state.round){alert('한 타일은 한 라운드에 1대1 전투만 가능합니다.');return}A.fought=D.fought=state.round;const ap=power(A),dp=power(D);const an=state.students.find(s=>s.id===A.playerId)?.name||'',dn=state.students.find(s=>s.id===D.playerId)?.name||'';if(ap>dp){D.country=A.country;state.students.find(s=>s.id===D.playerId).country=A.country;state.log.unshift(an+' 승리 → '+dn+' 영토 정복')}else if(ap<dp)state.log.unshift(dn+' 방어 성공');else state.log.unshift(an+' ↔ '+dn+' 동률 → 가위바위보');sel=target=null;save();alert(ap===dp?'전투력 동률! 가위바위보로 결정합니다.':ap>dp?'공격 성공!':'공격 실패!') }
function tileSVG(i){const c=MAP.cells[i],t=state.territories[i],s=state.students.find(x=>x.id===t.playerId),m=me(),mine=m&&t.country===m.country,locked=t.fought===state.round,selected=sel===i||target===i;let label=t.isKing?'<text x="'+c.cx+'" y="'+(c.cy-1)+'" class="crown">♛</text><text x="'+c.cx+'" y="'+(c.cy+12)+'" class="name">'+(s?.name||'왕')+'</text>':'<text x="'+c.cx+'" y="'+(c.cy-7)+'" class="num">'+(i+1)+'번</text><text x="'+c.cx+'" y="'+(c.cy+4)+'" class="name">'+(s?.name||'대기')+'</text>'+(mine?'<text x="'+c.cx+'" y="'+(c.cy+15)+'" class="power">⚔ '+fmt(power(t))+'</text>':'<text x="'+c.cx+'" y="'+(c.cy+15)+'" class="q">전투력 ?</text>');return '<g class="tg" data-i="'+i+'"><polygon class="tile '+c.k+' '+(mine?'mine ':'')+(t.isKing?'king ':'')+(locked?'locked ':'')+(selected?'selected':'')+'" points="'+c.p.map(q=>q.join(',')).join(' ')+'"></polygon>'+label+'</g>'}
function mapHTML(){return '<div class="map"><svg viewBox="0 0 250 420">'+MAP.cells.map((_,i)=>tileSVG(i)).join('')+'</svg></div><div class="legend"><span>내 영토 · 전투력 공개</span><span>상대 영토 · 전투력 ?</span><span>👑 왕 타일</span><span>⊘ 이번 라운드 전투 완료</span></div>'}
function launch(){return '<div class="wrap"><section class="card launch"><h1>삼국시대 정복 놀이</h1><p>교사용과 학생용이 하나의 게임방에서 연결되는 수업용 웹앱 프로토타입입니다.</p><div class="choices"><button class="choice" id="teacher"><b>👨‍🏫 교사로 시작</b><span>학생 수 설정 · 방 만들기 · 왕 배정 · 게임 진행</span></button><button class="choice" id="student"><b>👩‍🎓 학생으로 참가</b><span>방 번호와 이름을 입력하고 자신의 영토로 입장</span></button></div></section></div>'}
function setup(){return '<div class="wrap"><section class="card launch"><h1>게임 만들기</h1><div class="form-grid"><div><label>학생 수</label><select id="n">'+Array.from({length:22},(_,i)=>'<option '+(i+9===25?'selected':'')+'>'+(i+9)+'</option>').join('')+'</select></div></div><div class="notice" style="margin-top:12px">현재 예시는 25명 지도 기준. 한반도 안의 타일, 세 나라 상호 접경, 왕 타일 비인접 원칙을 유지합니다.</div><button class="btn primary" id="create" style="margin-top:12px">게임방 만들기</button></section></div>'}
function teacher(){const gs=state.students.filter(s=>s.country==='g'),bs=state.students.filter(s=>s.country==='b'),ss=state.students.filter(s=>s.country==='s');const opts=(arr)=>'<option value="">선택</option>'+arr.map(s=>'<option value="'+s.id+'" '+(s.isKing?'selected':'')+'>'+s.name+'</option>').join('');const ready=state.students.length===state.n&&['g','b','s'].every(k=>state.students.some(s=>s.country===k&&s.isKing));return '<div class="wrap"><div class="head"><h1>👨‍🏫 교사 화면</h1><span class="pill">방 '+state.code+'</span><span class="pill">'+state.students.length+'/'+state.n+'명</span><div class="spacer"></div><button class="btn" id="home">처음</button></div><div class="grid"><section class="card"><div class="sectionhead"><h2>학생 접속 현황</h2><p>학생의 국가와 배정 영토를 확인합니다.</p></div><div class="pad"><div class="roster">'+(state.students.length?state.students.map(s=>'<div class="person"><b>'+s.name+(s.isKing?' 👑':'')+'</b><small>'+ICON[s.country]+' '+COUNTRIES[s.country]+' · '+(s.tile+1)+'번</small><button class="btn" style="margin-top:7px;font-size:11px" data-point="'+s.id+'">정답 +1</button></div>').join(''):'학생을 기다리는 중…')+'</div></div></section><aside><section class="card" style="margin-bottom:14px"><div class="sectionhead"><h2>👑 왕 배정</h2><p>교사가 학생을 선택합니다.</p></div><div class="pad"><div class="select-row"><div><label>고구려 왕</label><select class="ks" data-k="g">'+opts(gs)+'</select></div><div><label>백제 왕</label><select class="ks" data-k="b">'+opts(bs)+'</select></div><div><label>신라 왕</label><select class="ks" data-k="s">'+opts(ss)+'</select></div></div><button class="btn primary" id="saveKings" style="margin-top:10px">왕 배정 저장</button></div></section><section class="card"><div class="sectionhead"><h2>게임 진행</h2></div><div class="pad"><div class="notice">'+(state.round===1?'1라운드 · 준비 및 내정 / 전투 불가':'현재 전투 가능 라운드')+'</div><button class="btn primary" id="start" '+(ready?'':'disabled')+' style="width:100%;margin-top:9px">게임 시작</button><button class="btn" id="next" '+(state.status==='running'?'':'disabled')+' style="width:100%;margin-top:7px">다음 라운드</button><button class="btn danger" id="reset" style="width:100%;margin-top:7px">게임 초기화</button></div></section></aside></div></div>'}
function join(){return '<div class="wrap"><section class="card launch"><h1>학생으로 참가</h1><div class="form-grid"><div><label>게임방 코드</label><input id="code" placeholder="ABC123"></div><div><label>이름</label><input id="nm" placeholder="이름"></div></div><button class="btn primary" id="join" style="margin-top:12px">참가</button></section></div>'}
function student(){const s=me(),t=myTile();if(!s||!t)return '<div class="wrap"><div class="card launch"><h1>학생 정보를 찾을 수 없습니다.</h1></div></div>';if(s.isKing)return king();return '<div class="wrap"><div class="head"><h1>👩‍🎓 학생 화면</h1><span class="pill">'+ICON[s.country]+' '+COUNTRIES[s.country]+'</span><span class="pill">'+s.name+'</span><span class="pill">'+state.round+'라운드</span></div><div class="tabs"><button class="tab '+(tab==='map'?'active':'')+'" id="tabMap">전체 영토</button><button class="tab '+(tab==='manage'?'active':'')+'" id="tabManage">내정 관리</button></div>'+(tab==='map'?'<section class="card"><div class="sectionhead"><h2>🗺️ 전체 영토</h2><p>모든 타일에 이름, 내 타일에만 전투력을 표시합니다.</p></div><div class="pad">'+mapHTML()+'</div></section>':'<section class="card"><div class="sectionhead"><h2>🛠️ 내정 관리</h2></div><div class="pad"><div class="stats"><div class="stat"><small>⭐ 전략</small><b>'+t.strategy+'</b></div><div class="stat"><small>🍚 식량</small><b>'+t.food+'</b></div><div class="stat"><small>⚔️ 병력</small><b>'+t.troops+'</b></div><div class="stat"><small>🌾 생산</small><b>'+t.production+'</b></div><div class="stat"><small>💪 전투력</small><b>'+fmt(power(t))+'</b></div></div><div class="notice '+(t.food+t.production-t.troops<0?'warn':'')+'" style="margin-top:10px">다음 라운드 식량 예상: '+(t.food+t.production-t.troops)+'</div><div class="actions"><div class="action"><h4>⚔️ 병력 모집</h4><p>전략 1 → 병력 +1</p><button class="btn primary act" data-a="troop">실행</button></div><div class="action"><h4>💪 군사력 강화</h4><p>전략 2 + 현재 단계 → 군사 배율 +0.25</p><button class="btn primary act" data-a="military">실행</button></div><div class="action"><h4>🌾 농업 발전</h4><p>전략 2 → 생산 +1</p><button class="btn primary act" data-a="agri">실행</button></div></div></div></section>')+'</div>'}
function king(){const s=me();return '<div class="wrap"><div class="head"><h1>👑 '+COUNTRIES[s.country]+' 왕 지휘 화면</h1><span class="pill">'+s.name+'</span><span class="pill">'+state.round+'라운드</span></div><div class="grid"><section class="card"><div class="sectionhead"><h2>🗺️ 삼국 전체 지도</h2><p>내 나라 전투력만 공개 · 상대국은 이름만 공개</p></div><div class="pad">'+mapHTML()+'</div></section><aside><section class="card" style="margin-bottom:14px"><div class="sectionhead"><h2>⚔️ 전쟁 명령</h2><p>한 타일은 한 라운드 1번만 1대1 전투 가능</p></div><div class="pad"><div class="notice">'+(sel==null?'우리 나라의 타일을 선택하세요.':target==null?('공격 주체: '+(sel+1)+'번 · '+state.students.find(x=>x.id===state.territories[sel].playerId)?.name+'<br>전투력 ⚔ '+fmt(power(state.territories[sel]))+'<br>→ 인접한 상대 타일을 선택하세요.'):((sel+1)+'번 → '+(target+1)+'번 · 상대 전투력 ?'))+'</div><button class="btn primary" id="doBattle" '+(sel!=null&&target!=null?'':'disabled')+' style="width:100%;margin-top:9px">전쟁 명령</button><button class="btn" id="clear" style="width:100%;margin-top:7px">선택 취소</button></div></section><section class="card"><div class="sectionhead"><h2>🏛️ 국가 발전</h2></div><div class="pad"><div class="actions">'+[['iron','⚒️ 철기','국가 전투력 ×1.15'],['law','📜 율령','전쟁 명령 보너스(설계 예정)'],['buddhism','☸️ 불교','일반 학생 전략 포인트 +1']].map(x=>'<div class="action"><h4>'+x[1]+'</h4><p>'+x[2]+'</p><button class="btn primary nat" data-n="'+x[0]+'" '+(state.tech[s.country][x[0]]?'disabled':'')+'>'+ (state.tech[s.country][x[0]]?'완료':'선택')+'</button></div>').join('')+'</div></div></section></aside></div></div>'}
function bind(){document.getElementById('teacher')?.addEventListener('click',()=>{role='teacher';screen='setup';render()});document.getElementById('student')?.addEventListener('click',()=>{role='student';screen='join';render()});document.getElementById('back')?.addEventListener('click',()=>{screen='launch';render()});document.getElementById('home')?.addEventListener('click',()=>{screen='launch';role='';pid='';render()});document.getElementById('create')?.addEventListener('click',()=>{init(Number(document.getElementById('n').value));screen='teacher';role='teacher';save()});document.getElementById('join')?.addEventListener('click',()=>{const x=load();if(!x||x.code!==document.getElementById('code').value.trim().toUpperCase()){alert('게임방 코드를 확인하세요.');return}state=x;if(!add(document.getElementById('nm').value)){alert('참가할 수 없습니다.');return}screen='student';save()});document.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>addPoint(b.dataset.point));document.getElementById('saveKings')?.addEventListener('click',()=>{let ok=true;document.querySelectorAll('.ks').forEach(x=>{if(!x.value)ok=false;else assignKing(x.dataset.k,x.value)});if(!ok){alert('세 나라 왕을 모두 선택하세요.');return}save()});document.getElementById('start')?.addEventListener('click',()=>{state.status='running';save()});document.getElementById('next')?.addEventListener('click',nextRound);document.getElementById('reset')?.addEventListener('click',()=>{if(confirm('초기화할까요?')){init(state.n);save()}});document.getElementById('tabMap')?.addEventListener('click',()=>{tab='map';render()});document.getElementById('tabManage')?.addEventListener('click',()=>{tab='manage';render()});document.querySelectorAll('.act').forEach(b=>b.onclick=()=>act(b.dataset.a));document.querySelectorAll('.nat').forEach(b=>b.onclick=()=>{const k=me().country,n=b.dataset.n;if(state.uses[k]>=2||state.tech[k][n])return;state.tech[k][n]=true;state.uses[k]++;if(n==='buddhism')state.territories.forEach(t=>{if(t.country===k&&!t.isKing)t.strategy++});save()});document.querySelectorAll('.tg').forEach(g=>g.onclick=()=>{if(!me()?.isKing)return;const i=Number(g.dataset.i),t=state.territories[i];if(sel==null){if(t.country!==me().country||t.isKing||t.fought===state.round){alert(t.isKing?'왕 타일은 전투하지 않습니다.':t.fought===state.round?'이미 전투한 타일입니다.':'우리 나라 타일을 선택하세요.');return}sel=i}else if(target==null){if(i===sel)sel=null;else if(t.country===me().country){if(!t.isKing&&t.fought!==state.round)sel=i}else if((MAP.adj[sel]||[]).includes(i)&&!t.isKing&&t.fought!==state.round)target=i;else alert(t.isKing?'왕 타일은 전투하지 않습니다.':t.fought===state.round?'이미 이번 라운드 전투한 타일입니다.':'인접한 전투 가능 타일을 선택하세요.')}render()});document.getElementById('clear')?.addEventListener('click',()=>{sel=target=null;render()});document.getElementById('doBattle')?.addEventListener('click',()=>{if(sel!=null&&target!=null)battle(sel,target)})}
function render(){document.getElementById('topInfo').innerHTML=state?('방 <b>'+state.code+'</b> · '+(role==='teacher'?'교사':(me()?.isKing?'왕':'학생'))):'';document.getElementById('app').innerHTML=screen==='launch'?launch():screen==='setup'?setup():screen==='teacher'?teacher():screen==='join'?join():student();bind()}
state=load();render();</script></body></html>
